apiVersion: v1
kind: Namespace
metadata:
  name: cnf-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnf
  namespace: cnf-lab
spec:
  replicas: 2
  selector:
    matchLabels: {app: cnf}
  template:
    metadata:
      labels: {app: cnf}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: cnf
        image: cnf:local
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8080}]
        readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 5, failureThreshold: 2}
        livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 10, failureThreshold: 3}
        resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: cnf
  namespace: cnf-lab
spec:
  selector: {app: cnf}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnf-healer
  namespace: cnf-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnf-healer
rules:
- apiGroups: [""] resources: ["pods","pods/log","events"] verbs: ["get","list","watch","delete","patch"]
- apiGroups: ["apps"] resources: ["deployments"] verbs: ["get","list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnf-healer
subjects:
- kind: ServiceAccount
  name: cnf-healer
  namespace: cnf-lab
roleRef:
  kind: ClusterRole
  name: cnf-healer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnf-healer
  namespace: cnf-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: cnf-healer}
  template:
    metadata:
      labels: {app: cnf-healer}
    spec:
      serviceAccountName: cnf-healer
      securityContext: {runAsNonRoot: true, runAsUser: 10002, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: healer
        image: cnf-healer:local
        imagePullPolicy: IfNotPresent
        env:
        - {name: WATCH_NAMESPACE, value: cnf-lab}
        - {name: HEAL_INTERVAL, value: "10"}
        - {name: FAIL_THRESHOLD, value: "2"}
        resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
